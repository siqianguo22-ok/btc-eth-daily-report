name: BTC/ETH 每日高低价

on:
  schedule:
    # 每天 UTC 00:20 = 北京时间 08:20
    - cron: "20 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-eth-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and push
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python scripts/fetch_and_push.py

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no archive changes"
          else
            git commit -m "chore: archive $(date -u +%F)"
            git push
          fi

      - name: Notify failure
        if: failure()
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          msg="工作流运行失败，请到 Actions 页面查看日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -G "https://sctapi.ftqq.com/${SERVERCHAN_SENDKEY}.send" \
            --data-urlencode "title=BTC/ETH 定时任务失败" \
            --data-urlencode "desp=${msg}" || true
